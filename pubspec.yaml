name: dry_slots
description: "Dry Slots is a decision-first weather app for UK users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  go_router: ^16.3.0
  hive_flutter: ^1.1.0
  json_annotation: ^4.11.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.7.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  workmanager: ^0.5.2
  sentry_flutter: ^8.12.0
  shared_preferences: ^2.5.3
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.5.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#1B1D2A"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#1B1D2A"
  image: "assets/app_icon.png"
  android_12:
    color: "#1B1D2A"
    icon_background_color: "#1B1D2A"
    image: "assets/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
